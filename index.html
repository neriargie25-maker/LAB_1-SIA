<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculator Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1c1c1c;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
            gap: 30px;
        }
        .calculator {
            background: #000;
            border-radius: 20px;
            padding: 20px;
            width: 360px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .display {
            color: white;
            text-align: right;
            padding: 20px 10px;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .expression {
            color: #a5a5a5;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .result {
            font-size: 48px;
            font-weight: 300;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            height: 72px;
            transition: filter 0.2s;
        }
        button:active {
            filter: brightness(1.5);
        }
        .gray {
            background: #a5a5a5;
            color: #000;
            font-size: 20px;
        }
        .dark {
            background: #333;
            color: white;
        }
        .orange {
            background: #ff9f0a;
            color: white;
            font-size: 28px;
        }
        .zero {
            grid-column: span 2;
            border-radius: 36px;
            text-align: left;
            padding-left: 30px;
        }

        /* HISTORY PANEL */
        .history-panel {
            background: #2a2a2a;
            border-radius: 16px;
            width: 380px;
            padding: 25px;
            color: white;
            max-height: 600px;
            overflow-y: auto;
        }
        .history-panel h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #ff9f0a;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .history-item {
            padding: 12px 0;
            border-bottom: 1px solid #444;
            font-size: 16px;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-exp {
            color: #a5a5a5;
            font-size: 14px;
        }
        .history-res {
            color: #fff;
            font-size: 18px;
            margin-top: 4px;
        }
        .empty-history {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        .clear-history-btn {
            margin-top: 15px;
            width: 100%;
            border-radius: 10px;
            height: 45px;
            background: #444;
            color: #ff6b6b;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="gray" id="ac">AC</button>
            <button class="gray">%</button>
            <button class="gray">+/-</button>
            <button class="orange" data-op="divide">÷</button>

            <button class="dark" data-num="7">7</button>
            <button class="dark" data-num="8">8</button>
            <button class="dark" data-num="9">9</button>
            <button class="orange" data-op="multiply">×</button>

            <button class="dark" data-num="4">4</button>
            <button class="dark" data-num="5">5</button>
            <button class="dark" data-num="6">6</button>
            <button class="orange" data-op="subtract">−</button>

            <button class="dark" data-num="1">1</button>
            <button class="dark" data-num="2">2</button>
            <button class="dark" data-num="3">3</button>
            <button class="orange" data-op="add">+</button>

            <button class="dark zero" data-num="0">0</button>
            <button class="dark" data-num=".">.</button>
            <button class="orange" id="equals">=</button>
        </div>
    </div>

    <div class="history-panel">
        <h2>📜 Calculation History</h2>
        <div id="historyList">
            <div class="empty-history">No calculations yet</div>
        </div>
        <button class="clear-history-btn" id="clearHistory">Clear History</button>
    </div>

    <script>
        let num1 = '';
        let num2 = '';
        let operation = null;
        let shouldReset = false;

        const display = document.getElementById('display');
        const expression = document.getElementById('expression');
        const historyList = document.getElementById('historyList');

        // Load saved history from localStorage
        let history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
        renderHistory();

        // Number buttons
        document.querySelectorAll('[data-num]').forEach(btn => {
            btn.addEventListener('click', () => {
                if (shouldReset) {
                    num1 = '';
                    num2 = '';
                    operation = null;
                    shouldReset = false;
                }
                const val = btn.dataset.num;
                if (operation === null) {
                    if (val === '.' && num1.includes('.')) return;
                    num1 += val;
                    display.textContent = num1;
                } else {
                    if (val === '.' && num2.includes('.')) return;
                    num2 += val;
                    display.textContent = num2;
                }
                updateExpression();
            });
        });

        // Operation buttons
        document.querySelectorAll('[data-op]').forEach(btn => {
            btn.addEventListener('click', () => {
                if (num1 === '') return;
                if (num2 !== '') calculate();
                operation = btn.dataset.op;
                shouldReset = false;
                updateExpression();
            });
        });

        // AC button
        document.getElementById('ac').addEventListener('click', () => {
            num1 = '';
            num2 = '';
            operation = null;
            display.textContent = '0';
            expression.textContent = '';
        });

        // Equals button
        document.getElementById('equals').addEventListener('click', calculate);

        async function calculate() {
            if (num1 === '' || operation === null) return;
            if (num2 === '') num2 = '0';

            const data = {
                num1: parseFloat(num1),
                num2: parseFloat(num2),
                operation: operation
            };

            try {
                const res = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await res.json();

                // Show result
                display.textContent = json.result;
                updateExpression();

                // Add to history
                addToHistory(data, json.result);

                // Prepare for next calculation
                num1 = String(json.result);
                num2 = '';
                operation = null;
                shouldReset = true;

            } catch (err) {
                display.textContent = 'Error';
            }
        }

        function updateExpression() {
            const opSymbols = { add: '+', subtract: '−', multiply: '×', divide: '÷', modulo: '%', power: '^', square_root: '√' };
            let text = num1;
            if (operation) text += ' ' + opSymbols[operation] + ' ' + (num2 || '');
            expression.textContent = text;
        }

        function addToHistory(data, result) {
            const opSymbols = { add: '+', subtract: '−', multiply: '×', divide: '÷', modulo: '%', power: '^', square_root: '√' };
            history.unshift({
                expr: `${data.num1} ${opSymbols[data.operation]} ${data.num2}`,
                result: result
            });
            if (history.length > 20) history.pop(); // Keep last 20
            localStorage.setItem('calcHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">No calculations yet</div>';
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-exp">${item.expr}</div>
                    <div class="history-res">= ${item.result}</div>
                </div>
            `).join('');
        }

        // Clear history button
        document.getElementById('clearHistory').addEventListener('click', () => {
            history = [];
            localStorage.removeItem('calcHistory');
            renderHistory();
        });
    </script>
</body>
</html>
